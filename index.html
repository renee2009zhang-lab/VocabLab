<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAT 核心词汇练习</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            themeBg: '#F8F9FA',
            themeMain: '#A0A0A3',
            themeBorder: '#D6D8DC',
            themeDark: '#5F5F60',
            themeDarker: '#4A4A4B',
            themeAccent: '#E5E7EB'
          }
        }
      }
    }
  </script>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #F8F9FA;
      color: #5F5F60;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    /* Card Flip Style */
    .perspective-1000 {
      perspective: 1000px;
    }
    .transform-style-3d {
      transform-style: preserve-3d;
      transition: transform 0.5s ease-in-out;
    }
    .backface-hidden {
      backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #F8F9FA;
    }
    ::-webkit-scrollbar-thumb {
      background: #D6D8DC;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #A0A0A3;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header / Navigation -->
  <header class="bg-white/80 backdrop-blur-md border-b border-themeBorder sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-graduation-cap text-2xl text-themeDark"></i>
        <h1 class="text-xl font-bold tracking-wide text-themeDark">SAT</h1>
      </div>
      
      <!-- Mode Navigation Tabs -->
      <nav class="flex bg-themeBg p-1 rounded-xl border border-themeBorder/50 text-xs sm:text-sm font-medium">
        <button id="nav-flashcard" onclick="switchTab('flashcard')" class="px-3 py-1.5 rounded-lg transition-all duration-200">
          <i class="fa-solid fa-layer-group mr-1"></i>闪卡背诵
        </button>
        <button id="nav-quiz" onclick="switchTab('quiz')" class="px-3 py-1.5 rounded-lg transition-all duration-200">
          <i class="fa-solid fa-circle-question mr-1"></i>智能抽背
        </button>
        <button id="nav-spelling" onclick="switchTab('spelling')" class="px-3 py-1.5 rounded-lg transition-all duration-200">
          <i class="fa-solid fa-pen-to-square mr-1"></i>拼写默写
        </button>
        <button id="nav-overview" onclick="switchTab('overview')" class="px-3 py-1.5 rounded-lg transition-all duration-200">
          <i class="fa-solid fa-list-check mr-1"></i>词汇总览
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-4 flex flex-col">

    <!-- Global Group Filter (Common for Flashcard & Spelling) -->
    <div id="group-filter-bar" class="mb-4 bg-white/60 p-3 rounded-2xl border border-themeBorder/40 flex flex-wrap items-center justify-between gap-3 shadow-sm">
      <div class="flex flex-wrap items-center gap-3">
        <span class="text-xs font-semibold uppercase tracking-wider text-themeDark/70">选择词表:</span>
        <select id="word-list-select" onchange="onWordListChange(this.value)" class="bg-white border border-themeBorder rounded-lg px-3 py-1 text-sm font-medium text-themeDark focus:outline-none focus:ring-2 focus:ring-themeMain">
          <!-- Options populated dynamically -->
        </select>
        <span class="text-xs font-semibold uppercase tracking-wider text-themeDark/70">选择分组:</span>
        <select id="group-select" onchange="onGroupChange(this.value)" class="bg-white border border-themeBorder rounded-lg px-3 py-1 text-sm font-medium text-themeDark focus:outline-none focus:ring-2 focus:ring-themeMain">
          <!-- Options populated dynamically -->
        </select>
      </div>
      <div id="group-info" class="text-xs text-themeDark/80 font-medium">
        加载中...
      </div>
    </div>

    <!-- 1. 闪卡背诵 (Flashcard View) -->
    <section id="view-flashcard" class="flex-1 flex flex-col items-center justify-center py-4">
      <!-- Group Indicator -->
      <div class="text-xs font-semibold text-themeMain mb-2 uppercase tracking-widest" id="fc-progress-text">词汇 1 / 50</div>

      <!-- Card Container -->
      <div class="w-full max-w-md h-80 perspective-1000 cursor-pointer my-2" onclick="flipCard()">
        <div id="flashcard-inner" class="relative w-full h-full transform-style-3d rounded-3xl shadow-lg border border-themeBorder/50 bg-white">
          <!-- Front (English) -->
          <div class="absolute inset-0 backface-hidden flex flex-col items-center justify-center p-6 text-center rounded-3xl bg-white">
            <span id="fc-star" onclick="toggleFuzzyCurrent(event)" class="absolute top-4 right-4 text-2xl text-themeBorder hover:text-amber-400 transition-colors">
              <i class="fa-star fa-regular"></i>
            </span>
            <div class="text-xs px-2.5 py-1 rounded-full bg-themeBg text-themeDark font-semibold mb-4" id="fc-id-tag">#1</div>
            <h2 class="text-3xl font-extrabold text-themeDark tracking-tight mb-2" id="fc-english">profound</h2>
            <p class="text-xs text-themeMain mt-4">点击卡片翻面查看释义</p>
          </div>
          <!-- Back (Chinese) -->
          <div class="absolute inset-0 backface-hidden rotate-y-180 flex flex-col items-center justify-center p-6 text-center rounded-3xl bg-themeBg/40 border-2 border-themeAccent/40">
            <span class="text-xs uppercase tracking-widest text-themeMain mb-2 font-semibold">中文释义</span>
            <p class="text-2xl font-bold text-themeDark leading-relaxed" id="fc-chinese">adj. 巨大的；强烈的；深奥的</p>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center justify-center gap-4 mt-6">
        <button onclick="prevCard()" class="w-12 h-12 rounded-full bg-white border border-themeBorder text-themeDark hover:bg-themeBg flex items-center justify-center shadow-sm active:scale-95 transition-all">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <button onclick="handleFlashcardMarkButton(event)" id="fc-mark-btn" class="px-4 py-2.5 rounded-xl border border-themeBorder bg-white text-xs font-semibold text-themeDark hover:bg-themeBg flex items-center gap-1.5 shadow-sm transition-all">
          <i class="fa-regular fa-star text-amber-400"></i> 标记模糊
        </button>
        <button onclick="nextCard()" class="w-12 h-12 rounded-full bg-white border border-themeBorder text-themeDark hover:bg-themeBg flex items-center justify-center shadow-sm active:scale-95 transition-all">
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
    </section>

    <!-- 2. 智能抽背 (Smart Quiz View) -->
    <section id="view-quiz" class="hidden flex-1 flex flex-col max-w-xl mx-auto w-full">
      <!-- Quiz Setup Panel -->
      <div id="quiz-setup" class="bg-white rounded-3xl p-6 shadow-sm border border-themeBorder/50 my-auto">
        <h2 class="text-lg font-bold text-themeDark mb-4 flex items-center gap-2">
          <i class="fa-solid fa-sliders text-themeMain"></i> 抽背设置
        </h2>
        
        <div class="space-y-4">
          <!-- Scope Selection -->
          <div>
            <label class="block text-xs font-semibold text-themeDark/80 mb-1">抽背范围</label>
            <select id="quiz-scope" class="w-full bg-themeBg/30 border border-themeBorder rounded-xl p-2.5 text-sm text-themeDark focus:outline-none">
              <option value="group">当前选定组 (50词)</option>
              <option value="all">全部词汇 (300词)</option>
              <option value="fuzzy">优先模糊词汇</option>
            </select>
          </div>

          <!-- Direction Selection -->
          <div>
            <label class="block text-xs font-semibold text-themeDark/80 mb-1">抽背模式</label>
            <div class="grid grid-cols-2 gap-2">
              <label class="flex items-center gap-2 p-2.5 border border-themeBorder rounded-xl bg-themeBg/20 cursor-pointer text-sm">
                <input type="radio" name="quiz-dir" value="en2cn" checked class="accent-themeDark">
                看英文选中文
              </label>
              <label class="flex items-center gap-2 p-2.5 border border-themeBorder rounded-xl bg-themeBg/20 cursor-pointer text-sm">
                <input type="radio" name="quiz-dir" value="cn2en" class="accent-themeDark">
                看中文选英文
              </label>
            </div>
          </div>

          <!-- Number of Questions -->
          <div>
            <label class="block text-xs font-semibold text-themeDark/80 mb-1">抽背数量</label>
            <div class="flex items-center gap-2">
              <input type="range" id="quiz-count-slider" min="5" max="50" step="5" value="20" oninput="document.getElementById('quiz-count-val').innerText = this.value" class="w-full accent-themeDark">
              <span id="quiz-count-val" class="font-bold text-sm text-themeDark min-w-[2rem] text-right">20</span> 词
            </div>
          </div>

          <button onclick="startQuiz()" class="w-full py-3 bg-themeDark text-white font-bold rounded-xl shadow hover:bg-themeDarker transition-all mt-4">
            开始抽背
          </button>
        </div>
      </div>

      <!-- Quiz Active Test Area -->
      <div id="quiz-active" class="hidden flex-1 flex flex-col justify-between py-4">
        <div>
          <!-- Quiz Header -->
          <div class="flex justify-between items-center mb-4">
            <span id="quiz-progress" class="text-xs font-bold text-themeMain uppercase tracking-widest">1 / 20</span>
            <span id="quiz-score" class="text-xs font-bold px-2.5 py-1 bg-emerald-100 text-emerald-700 rounded-full">准确率: 100%</span>
          </div>

          <!-- Question Prompt Card -->
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-themeBorder/50 text-center mb-6 min-h-[120px] flex flex-col justify-center items-center">
            <span class="text-xs text-themeMain mb-1" id="quiz-prompt-label">请选择对应的中文</span>
            <h3 class="text-2xl font-extrabold text-themeDark" id="quiz-prompt-text">profound</h3>
          </div>

          <!-- Options -->
          <div class="grid grid-cols-1 gap-3" id="quiz-options-container">
            <!-- Dynamically populated options -->
          </div>
        </div>

        <!-- Quiz Control/Next Button -->
        <div class="mt-6 flex justify-between items-center">
          <button onclick="exitQuiz()" class="text-xs text-themeMain hover:text-themeDark font-semibold px-3 py-2">
            放弃重来
          </button>
          <button id="quiz-next-btn" onclick="nextQuizQuestion()" disabled class="px-6 py-2.5 bg-themeMain text-white font-semibold rounded-xl disabled:opacity-40 disabled:cursor-not-allowed hover:bg-themeDark transition-all">
            下一题
          </button>
        </div>
      </div>

      <!-- Quiz Results Panel -->
      <div id="quiz-result" class="hidden bg-white rounded-3xl p-6 shadow-sm border border-themeBorder/50 my-auto text-center">
        <i class="fa-solid fa-trophy text-4xl text-amber-400 mb-2"></i>
        <h2 class="text-xl font-bold text-themeDark mb-1">完成抽背测验!</h2>
        <p class="text-xs text-themeMain mb-6">做错或标记模糊的词汇可在闪卡模式重点复习</p>

        <div class="bg-themeBg/50 rounded-2xl p-4 mb-6 grid grid-cols-3 gap-2">
          <div>
            <div class="text-xs text-themeMain">总题数</div>
            <div class="text-lg font-bold text-themeDark" id="res-total">0</div>
          </div>
          <div>
            <div class="text-xs text-themeMain">答对</div>
            <div class="text-lg font-bold text-emerald-600" id="res-correct">0</div>
          </div>
          <div>
            <div class="text-xs text-themeMain">准确率</div>
            <div class="text-lg font-bold text-themeDark" id="res-accuracy">0%</div>
          </div>
        </div>

        <button onclick="resetQuizSetup()" class="w-full py-3 bg-themeDark text-white font-bold rounded-xl shadow hover:bg-themeDarker transition-all">
          再测一次
        </button>
      </div>
    </section>

    <!-- 3. 拼写默写 (Spelling Test View - Manual Check Mode) -->
    <section id="view-spelling" class="hidden flex-1 flex flex-col items-center justify-center py-4">
      <div class="w-full max-w-md bg-white rounded-3xl shadow-sm border border-themeBorder/50 p-6">
        <div class="flex justify-between items-center mb-4">
          <span id="sp-progress" class="text-xs font-bold text-themeMain uppercase tracking-widest">词汇 1 / 50</span>
          <span class="text-xs bg-themeBg text-themeDark font-semibold px-2 py-0.5 rounded">type</span>
        </div>

        <!-- Prompt Word -->
        <div class="text-center my-6">
          <span class="text-xs text-themeMain">英文单词</span>
          <h2 class="text-3xl font-extrabold text-themeDark mt-1" id="sp-english">profound</h2>
        </div>

        <!-- User Input Area -->
        <div class="space-y-3 mb-4">
          <label class="block text-xs font-semibold text-themeDark/70">默写中文释义:</label>
          <textarea id="sp-user-input" rows="2" placeholder="在此打字输入你记忆的中文释义..." class="w-full border border-themeBorder rounded-xl p-3 text-sm text-themeDark focus:outline-none focus:ring-2 focus:ring-themeMain resize-none bg-themeBg/20"></textarea>
        </div>

        <!-- Action Area -->
        <div id="sp-action-area">
          <button onclick="revealSpellingAnswer()" class="w-full py-3 bg-themeDark text-white font-bold rounded-xl shadow hover:bg-themeDarker transition-all">
            确定 / 查看答案
          </button>
        </div>

        <!-- Reveal Answer Box (Hidden by default) -->
        <div id="sp-answer-box" class="hidden border-t border-themeBorder/40 pt-4 mt-4 text-center">
          <span class="text-xs text-themeMain">标准中文释义</span>
          <p class="text-lg font-bold text-[#787878] my-2" id="sp-correct-chinese">adj. 巨大的；强烈的；深奥的</p>
          <p class="text-xs text-themeMain mb-4">自己比对无误后即可点击下一个</p>
          <div class="grid grid-cols-[64px_1fr] gap-3">
            <button onclick="markSpellingFuzzyAndNext()" class="py-3 border border-themeBorder bg-white text-[#393c3b] text-xl leading-none font-bold rounded-xl shadow hover:bg-themeBg transition-all">
              &times;
            </button>
            <button onclick="nextSpellingWord()" class="py-3 bg-[#393c3b] text-white font-bold rounded-xl shadow hover:bg-themeDarker transition-all">
              next
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 4. 词汇总览 (Overview View) -->
    <section id="view-overview" class="hidden flex-1 flex flex-col">
      <!-- Search & Filters -->
      <div class="bg-white p-4 rounded-2xl border border-themeBorder/40 mb-4 shadow-sm flex flex-col sm:flex-row gap-3 items-center justify-between">
        <div class="relative w-full sm:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-themeMain text-sm"></i>
          <input type="text" id="overview-search" oninput="renderOverviewTable()" placeholder="搜索英文或中文..." class="w-full bg-themeBg/30 border border-themeBorder rounded-xl pl-9 pr-3 py-2 text-sm text-themeDark focus:outline-none focus:ring-1 focus:ring-themeMain">
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
          <button onclick="toggleOverviewFuzzyFilter()" id="overview-fuzzy-btn" class="px-3 py-2 border border-themeBorder rounded-xl text-xs font-semibold text-themeDark hover:bg-themeBg flex items-center gap-1">
            <i class="fa-solid fa-star text-amber-400"></i> 只看模糊词
          </button>
          <span id="overview-count" class="text-xs text-themeMain font-medium">共 300 词</span>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-2xl border border-themeBorder/40 shadow-sm overflow-hidden flex-1">
        <div class="max-h-[60vh] overflow-y-auto">
          <table class="w-full text-left border-collapse">
            <thead class="bg-themeBg/60 text-xs font-bold text-themeDark uppercase sticky top-0 border-b border-themeBorder/50">
              <tr>
                <th class="p-3 w-12 text-center">#</th>
                <th class="p-3">英文单词</th>
                <th class="p-3">中文释义</th>
                <th class="p-3 w-16 text-center">标记</th>
              </tr>
            </thead>
            <tbody id="overview-tbody" class="divide-y divide-themeBorder/30 text-sm text-themeDark">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </section>

  </main>

  <!-- Footnote -->
  <footer class="py-3 text-center text-xs text-themeDark/60 border-t border-themeBorder/30 bg-white/40">
    SAT 核心词汇练习
  </footer>

    function shuffleArray(list) {
      const shuffled = [...list];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    }

    function getWordUid(word) {
      return `${currentWordListId}:${word.id}`;
    }

    function buildGroups() {
      const words = getCurrentWordList().words;
      groups = [];
      for (let start = 0; start < words.length; start += wordsPerGroup) {
        const end = Math.min(start + wordsPerGroup, words.length);
        groups.push({
          start,
          end,
          label: `第 ${groups.length + 1} 组 (${start + 1} - ${end} 词)`
        });
      }
    }

    function initWordListDropdown() {
      const select = document.getElementById('word-list-select');
      select.innerHTML = '';
      Object.entries(wordLists).forEach(([id, list]) => {
        const opt = document.createElement('option');
        opt.value = id;
        opt.innerText = list.label;
        select.appendChild(opt);
      });
      select.value = currentWordListId;
    }

    function initGroupDropdown() {
      buildGroups();
      const select = document.getElementById('group-select');
      select.innerHTML = '';
      groups.forEach((g, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.innerText = g.label;
        select.appendChild(opt);
      });
    }

    function getWordsInGroup(gIdx) {
      const g = groups[gIdx];
      return getCurrentWordList().words.slice(g.start, g.end);
    }

    function onWordListChange(val) {
      currentWordListId = val;
      currentGroupIndex = 0;
      initGroupDropdown();
      resetFlashcardSession();
      resetSpellingSession();
      updateGroupInfoDisplay();

      if (currentTab === 'flashcard') renderFlashcard();
      if (currentTab === 'spelling') renderSpelling();
      if (currentTab === 'overview') renderOverviewTable();
      if (currentTab === 'quiz') resetQuizSetup();
    }

    function onGroupChange(val) {
      currentGroupIndex = parseInt(val);
      resetFlashcardSession();
      resetSpellingSession();
      updateGroupInfoDisplay();

      if (currentTab === 'flashcard') renderFlashcard();
      if (currentTab === 'spelling') renderSpelling();
    }

    function updateGroupInfoDisplay() {
      const words = getWordsInGroup(currentGroupIndex);
      document.getElementById('group-info').innerText = `${getCurrentWordList().label} | 本组共 ${words.length} 词 | 已标记模糊 ${words.filter(w => fuzzyWordIds.has(getWordUid(w))).length} 词`;
    }

    // Navigation Tab Switcher
    function switchTab(tab) {
      currentTab = tab;
      const tabs = ['flashcard', 'quiz', 'spelling', 'overview'];
      
      // Update Tab Styles
      tabs.forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        const view = document.getElementById(`view-${t}`);
        if (t === tab) {
          btn.className = "px-3 py-1.5 rounded-lg bg-themeDark text-white shadow font-semibold";
          view.classList.remove('hidden');
        } else {
          btn.className = "px-3 py-1.5 rounded-lg text-themeDark/70 hover:bg-white/50 font-medium";
          view.classList.add('hidden');
        }
      });

      // Keep word-list and group controls available across all modes.
      const filterBar = document.getElementById('group-filter-bar');
      filterBar.classList.remove('hidden');
      updateGroupInfoDisplay();

      // Render tab-specific view
      if (tab === 'flashcard') {
        if (fcSessionWords.length === 0) resetFlashcardSession();
        renderFlashcard();
      }
      if (tab === 'spelling') {
        resetSpellingSession();
        renderSpelling();
      }
      if (tab === 'overview') renderOverviewTable();
      if (tab === 'quiz') resetQuizSetup();
    }

    /* ----------------------------------------------------
       1. FLASHCARD LOGIC
    ---------------------------------------------------- */
    function resetFlashcardSession() {
      fcSessionWords = [...getWordsInGroup(currentGroupIndex)];
      fcIndexInGroup = 0;
      fcReviewWordIds.clear();
    }

    function getCurrentFlashcardWord() {
      if (fcSessionWords.length === 0) resetFlashcardSession();
      if (fcIndexInGroup >= fcSessionWords.length) fcIndexInGroup = 0;
      return fcSessionWords[fcIndexInGroup];
    }

    function removeFutureFlashcardRepeats(wordId) {
      fcSessionWords = fcSessionWords.filter((word, idx) => idx <= fcIndexInGroup || word.id !== wordId);
    }

    function scheduleFlashcardReview(word) {
      const offset = 3 + Math.floor(Math.random() * 3);
      const insertAt = Math.min(fcIndexInGroup + offset, fcSessionWords.length);
      fcSessionWords.splice(insertAt, 0, word);
    }

    function renderFlashcard() {
      const words = fcSessionWords.length ? fcSessionWords : getWordsInGroup(currentGroupIndex);
      const word = getCurrentFlashcardWord();

      // Reset flip
      isFcFlipped = false;
      document.getElementById('flashcard-inner').classList.remove('rotate-y-180');

      // Update contents
      document.getElementById('fc-progress-text').innerText = `词汇 ${fcIndexInGroup + 1} / ${words.length}`;
      document.getElementById('fc-id-tag').innerText = `#${word.id}`;
      document.getElementById('fc-english').innerText = word.en;
      document.getElementById('fc-chinese').innerText = word.cn;

      // Update Star Button
      const isFuzzy = fuzzyWordIds.has(getWordUid(word));
      const isInReview = fcReviewWordIds.has(word.id);
      const starIcon = document.getElementById('fc-star');
      const markBtn = document.getElementById('fc-mark-btn');

      if (isFuzzy) {
        starIcon.innerHTML = `<i class="fa-solid fa-star text-amber-400"></i>`;
        if (isInReview) {
          markBtn.className = "px-4 py-2.5 rounded-xl border border-themeBorder bg-[#393c3b] text-xs font-semibold text-white flex items-center gap-1.5 shadow-sm transition-all";
          markBtn.innerHTML = `<i class="fa-solid fa-check"></i> 已记住`;
        } else {
          markBtn.className = "px-4 py-2.5 rounded-xl border border-amber-300 bg-amber-50 text-xs font-semibold text-amber-800 flex items-center gap-1.5 shadow-sm transition-all";
          markBtn.innerHTML = `<i class="fa-solid fa-star text-amber-400"></i> 加入巩固`;
        }
      } else {
        starIcon.innerHTML = `<i class="fa-regular fa-star"></i>`;
        markBtn.className = "px-4 py-2.5 rounded-xl border border-themeBorder bg-white text-xs font-semibold text-themeDark hover:bg-themeBg flex items-center gap-1.5 shadow-sm transition-all";
        markBtn.innerHTML = `<i class="fa-regular fa-star text-amber-400"></i> 标记模糊`;
      }
    }

    function flipCard() {
      isFcFlipped = !isFcFlipped;
      const card = document.getElementById('flashcard-inner');
      if (isFcFlipped) {
        card.classList.add('rotate-y-180');
      } else {
        card.classList.remove('rotate-y-180');
      }
    }

    function prevCard() {
      const words = fcSessionWords.length ? fcSessionWords : getWordsInGroup(currentGroupIndex);
      fcIndexInGroup = (fcIndexInGroup - 1 + words.length) % words.length;
      renderFlashcard();
    }

    function nextCard() {
      const word = getCurrentFlashcardWord();
      if (fcReviewWordIds.has(word.id)) {
        scheduleFlashcardReview(word);
      }
      const words = fcSessionWords.length ? fcSessionWords : getWordsInGroup(currentGroupIndex);
      fcIndexInGroup = (fcIndexInGroup + 1) % words.length;
      renderFlashcard();
    }

    function handleFlashcardShortcuts(e) {
      if (currentTab !== 'flashcard') return;

      const tagName = e.target.tagName.toLowerCase();
      const isEditing = tagName === 'input' || tagName === 'textarea' || tagName === 'select' || e.target.isContentEditable;
      if (isEditing) return;

      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevCard();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextCard();
      } else if (e.key === ' ') {
        e.preventDefault();
        flipCard();
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        handleFlashcardMarkButton();
      }
    }

    function toggleFuzzyCurrent(e) {
      if(e) e.stopPropagation();
      const word = getCurrentFlashcardWord();
      const uid = getWordUid(word);
      if (fuzzyWordIds.has(uid)) {
        fuzzyWordIds.delete(uid);
        fcReviewWordIds.delete(word.id);
        removeFutureFlashcardRepeats(word.id);
      } else {
        fuzzyWordIds.add(uid);
        fcReviewWordIds.add(word.id);
      }
      saveFuzzyState();
      renderFlashcard();
      updateGroupInfoDisplay();
    }

    function handleFlashcardMarkButton(e) {
      if(e) e.stopPropagation();
      const word = getCurrentFlashcardWord();

      if (fcReviewWordIds.has(word.id)) {
        fcReviewWordIds.delete(word.id);
        removeFutureFlashcardRepeats(word.id);
      } else {
        fuzzyWordIds.add(getWordUid(word));
        fcReviewWordIds.add(word.id);
        saveFuzzyState();
      }

      renderFlashcard();
      updateGroupInfoDisplay();
    }

    /* ----------------------------------------------------
       2. SMART QUIZ LOGIC
    ---------------------------------------------------- */
    function resetQuizSetup() {
      document.getElementById('quiz-setup').classList.remove('hidden');
      document.getElementById('quiz-active').classList.add('hidden');
      document.getElementById('quiz-result').classList.add('hidden');
    }

    function startQuiz() {
      const scope = document.getElementById('quiz-scope').value;
      const dir = document.querySelector('input[name="quiz-dir"]:checked').value;
      const targetCount = parseInt(document.getElementById('quiz-count-slider').value);

      // 1. Gather Pool of words
      let pool = [];
      if (scope === 'group') {
        pool = getWordsInGroup(currentGroupIndex);
      } else if (scope === 'all') {
        pool = [...getCurrentWordList().words];
      } else if (scope === 'fuzzy') {
        pool = getCurrentWordList().words.filter(w => fuzzyWordIds.has(getWordUid(w)));
        if (pool.length < 4) {
          alert("模糊词汇不足 4 个，已自动为你补充其它词汇进行抽背。");
          const nonFuzzy = getCurrentWordList().words.filter(w => !fuzzyWordIds.has(getWordUid(w)));
          pool = pool.concat(nonFuzzy);
        }
      }

      const poolCopy = shuffleArray(pool);

      // Ensure every word is covered first if count >= pool length
      let sampleList = [];
      while (sampleList.length < targetCount) {
        if (poolCopy.length === 0) {
          // Re-fill pool, giving fuzzy words 3x weight
          pool.forEach(w => {
            if (fuzzyWordIds.has(getWordUid(w))) {
              poolCopy.push(w, w, w);
          } else {
            poolCopy.push(w);
          }
        });
          poolCopy.splice(0, poolCopy.length, ...shuffleArray(poolCopy));
        }
        sampleList.push(poolCopy.pop());
      }

      // Generate MCQs
      quizQuestions = sampleList.map(target => {
        const distractors = shuffleArray(getCurrentWordList().words.filter(w => w.id !== target.id)).slice(0, 3);
        
        const options = shuffleArray([target, ...distractors]);

        return {
          target: target,
          options: options,
          dir: dir
        };
      });

      quizCurrentIdx = 0;
      quizScore = 0;

      document.getElementById('quiz-setup').classList.add('hidden');
      document.getElementById('quiz-active').classList.remove('hidden');
      
      renderQuizQuestion();
    }

    function renderQuizQuestion() {
      const q = quizQuestions[quizCurrentIdx];
      quizSelectedOption = null;

      document.getElementById('quiz-progress').innerText = `${quizCurrentIdx + 1} / ${quizQuestions.length}`;
      const accuracy = quizCurrentIdx === 0 ? 100 : Math.round((quizScore / quizCurrentIdx) * 100);
      document.getElementById('quiz-score').innerText = `准确率: ${accuracy}%`;

      const promptLabel = document.getElementById('quiz-prompt-label');
      const promptText = document.getElementById('quiz-prompt-text');

      if (q.dir === 'en2cn') {
        promptLabel.innerText = "请选择对应的中文释义";
        promptText.innerText = q.target.en;
      } else {
        promptLabel.innerText = "请选择对应的英文单词";
        promptText.innerText = q.target.cn;
      }

      const container = document.getElementById('quiz-options-container');
      container.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl border border-themeBorder bg-white hover:bg-themeBg/50 text-sm font-medium text-themeDark transition-all flex items-center justify-between";
        btn.innerText = q.dir === 'en2cn' ? opt.cn : opt.en;
        btn.onclick = () => selectQuizOption(btn, opt, q.target);
        container.appendChild(btn);
      });

      const nextBtn = document.getElementById('quiz-next-btn');
      nextBtn.disabled = true;
      nextBtn.className = "px-6 py-2.5 bg-themeMain text-white font-semibold rounded-xl disabled:opacity-40 disabled:cursor-not-allowed hover:bg-themeDark transition-all";
    }

    function selectQuizOption(btnElement, selectedOption, targetOption) {
      if (quizSelectedOption !== null) return; // Prevent changing choice
      quizSelectedOption = selectedOption;

      const container = document.getElementById('quiz-options-container');
      const buttons = container.querySelectorAll('button');

      const isCorrect = selectedOption.id === targetOption.id;
      if (isCorrect) {
        quizScore++;
        btnElement.className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-sm font-bold text-emerald-800 transition-all flex items-center justify-between";
        btnElement.innerHTML += `<i class="fa-solid fa-circle-check text-emerald-600"></i>`;
      } else {
        btnElement.className = "w-full text-left p-4 rounded-xl border-2 border-rose-400 bg-rose-50 text-sm font-bold text-rose-800 transition-all flex items-center justify-between";
        btnElement.innerHTML += `<i class="fa-solid fa-circle-xmark text-rose-500"></i>`;
        
        // Highlight correct option
        buttons.forEach((b, idx) => {
          const opt = quizQuestions[quizCurrentIdx].options[idx];
          if (opt.id === targetOption.id) {
            b.className = "w-full text-left p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 text-sm font-bold text-emerald-800 transition-all flex items-center justify-between";
          }
        });

        // Mark as fuzzy automatically on mistake
        fuzzyWordIds.add(getWordUid(targetOption));
        saveFuzzyState();
      }

      const nextBtn = document.getElementById('quiz-next-btn');
      nextBtn.disabled = false;
      nextBtn.className = "px-6 py-2.5 bg-themeDark text-white font-semibold rounded-xl shadow hover:bg-themeDarker transition-all";
    }

    function nextQuizQuestion() {
      quizCurrentIdx++;
      if (quizCurrentIdx < quizQuestions.length) {
        renderQuizQuestion();
      } else {
        // Show Results
        document.getElementById('quiz-active').classList.add('hidden');
        document.getElementById('quiz-result').classList.remove('hidden');

        document.getElementById('res-total').innerText = quizQuestions.length;
        document.getElementById('res-correct').innerText = quizScore;
        const acc = Math.round((quizScore / quizQuestions.length) * 100);
        document.getElementById('res-accuracy').innerText = `${acc}%`;
      }
    }

    function exitQuiz() {
      if (confirm("确定要放弃本次抽背吗？")) {
        resetQuizSetup();
      }
    }

    /* ----------------------------------------------------
       3. SPELLING / MANUAL CHECK LOGIC
    ---------------------------------------------------- */
    function resetSpellingSession() {
      spSessionWords = shuffleArray(getWordsInGroup(currentGroupIndex));
      spIndexInGroup = 0;
    }

    function renderSpelling() {
      if (spSessionWords.length === 0) resetSpellingSession();
      const words = spSessionWords;
      if (spIndexInGroup >= words.length) spIndexInGroup = 0;
      const word = words[spIndexInGroup];

      document.getElementById('sp-progress').innerText = `词汇 ${spIndexInGroup + 1} / ${words.length}`;
      document.getElementById('sp-english').innerText = word.en;
      document.getElementById('sp-correct-chinese').innerText = word.cn;

      // Clear input
      document.getElementById('sp-user-input').value = '';

      // Hide answer box
      document.getElementById('sp-answer-box').classList.add('hidden');
      document.getElementById('sp-action-area').classList.remove('hidden');
    }

    function revealSpellingAnswer() {
      document.getElementById('sp-answer-box').classList.remove('hidden');
      document.getElementById('sp-action-area').classList.add('hidden');
    }

    function handleSpellingShortcuts(e) {
      if (currentTab !== 'spelling') return;

      const actionArea = document.getElementById('sp-action-area');
      const answerBox = document.getElementById('sp-answer-box');
      const key = e.key.toLowerCase();

      if (e.key === 'Enter' && !e.shiftKey && !actionArea.classList.contains('hidden')) {
        e.preventDefault();
        revealSpellingAnswer();
      } else if ((e.key === ' ' || key === 'j') && !answerBox.classList.contains('hidden')) {
        e.preventDefault();
        nextSpellingWord();
      } else if ((e.key === 'ArrowUp' || key === 'f') && !answerBox.classList.contains('hidden')) {
        e.preventDefault();
        markSpellingFuzzyAndNext();
      }
    }

    function markSpellingFuzzyAndNext() {
      const words = spSessionWords.length ? spSessionWords : getWordsInGroup(currentGroupIndex);
      const word = words[spIndexInGroup];
      fuzzyWordIds.add(getWordUid(word));
      saveFuzzyState();
      updateGroupInfoDisplay();
      nextSpellingWord();
    }

    function nextSpellingWord() {
      const words = spSessionWords.length ? spSessionWords : getWordsInGroup(currentGroupIndex);
      spIndexInGroup++;
      if (spIndexInGroup >= words.length) resetSpellingSession();
      renderSpelling();
    }

    /* ----------------------------------------------------
       4. OVERVIEW LOGIC
    ---------------------------------------------------- */
    let overviewOnlyFuzzy = false;

    function toggleOverviewFuzzyFilter() {
      overviewOnlyFuzzy = !overviewOnlyFuzzy;
      const btn = document.getElementById('overview-fuzzy-btn');
      if (overviewOnlyFuzzy) {
        btn.className = "px-3 py-2 border border-amber-300 bg-amber-50 rounded-xl text-xs font-semibold text-amber-800 flex items-center gap-1";
      } else {
        btn.className = "px-3 py-2 border border-themeBorder rounded-xl text-xs font-semibold text-themeDark hover:bg-themeBg flex items-center gap-1";
      }
      renderOverviewTable();
    }

    function renderOverviewTable() {
      const search = document.getElementById('overview-search').value.toLowerCase().trim();
      const tbody = document.getElementById('overview-tbody');
      tbody.innerHTML = '';

      let list = getCurrentWordList().words.filter(w => {
        const matchesSearch = w.en.toLowerCase().includes(search) || w.cn.includes(search);
        const matchesFuzzy = overviewOnlyFuzzy ? fuzzyWordIds.has(getWordUid(w)) : true;
        return matchesSearch && matchesFuzzy;
      });

      document.getElementById('overview-count').innerText = `共 ${list.length} 词`;

      list.forEach(w => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-themeBg/30 transition-colors";

        const isFuzzy = fuzzyWordIds.has(getWordUid(w));

        tr.innerHTML = `
          <td class="p-3 text-center text-xs text-themeMain font-semibold">${w.id}</td>
          <td class="p-3 font-bold text-themeDark">${w.en}</td>
          <td class="p-3 text-themeDark/80">${w.cn}</td>
          <td class="p-3 text-center">
            <button onclick="toggleFuzzyInOverview(${w.id})" class="text-lg hover:scale-110 transition-transform">
              ${isFuzzy ? '<i class="fa-solid fa-star text-amber-400"></i>' : '<i class="fa-regular fa-star text-themeBorder"></i>'}
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleFuzzyInOverview(id) {
      const uid = `${currentWordListId}:${id}`;
      if (fuzzyWordIds.has(uid)) {
        fuzzyWordIds.delete(uid);
      } else {
        fuzzyWordIds.add(uid);
      }
      saveFuzzyState();
      renderOverviewTable();
    }
  </script>
